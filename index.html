<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Sinhala & Tamil New Year Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Noto+Sans+Sinhala:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d32f2f;
            --background: #fff8e1;
            --text: #333;
        }
        body {
            font-family: 'Poppins', 'Noto Sans Sinhala', sans-serif;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
            border-top: 6px solid var(--primary);
        }
        h1 {
            color: var(--primary);
            margin-bottom: 5px;
            font-size: 1.8rem;
        }
        h2 {
            font-size: 1rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 400;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.2s ease;
            box-sizing: border-box;
            border: none;
            cursor: pointer;
        }
        
        /* Apple / iOS Button */
        .btn-apple {
            background-color: #000000;
            color: white;
        }
        .btn-apple:hover {
            background-color: #333333;
        }

        /* Google Calendar Button */
        .btn-google {
            background-color: #4285F4;
            color: white;
        }
        .btn-google:hover {
            background-color: #3367D6;
        }

        /* Download Button */
        .btn-download {
            background-color: #f1f3f4;
            color: #3c4043;
            border: 1px solid #dadce0;
        }
        .btn-download:hover {
            background-color: #e8eaed;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>2026 අලුත් අවුරුදු නැකත්</h1>
        <h2>Sinhala & Tamil New Year</h2>
        
        <div class="btn-group">
            <a href="webcal://perzona99.github.io/sinhala-tamil-awurudu-calendar/aluth_awurudu_2026.ics" class="btn btn-apple">
                🍏 Apple Calendar / iOS
            </a>
            
            <a href="https://calendar.google.com/calendar/render?cid=https://perzona99.github.io/sinhala-tamil-awurudu-calendar/aluth_awurudu_2026.ics" class="btn btn-google" target="_blank">
                📅 Google Calendar
            </a>

            <a href="https://perzona99.github.io/sinhala-tamil-awurudu-calendar/aluth_awurudu_2026.ics" class="btn btn-download" download>
                ⬇️ Download .ics File
            </a>
        </div>

        <div class="footer">
            Times are based on Sri Lanka Standard Time (GMT+5:30). Subscribing ensures times automatically adjust to your time zone.
        </div>
    </div>

</body>
</html>
